<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Typography AR - A-Frame</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.0/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    
    .controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 15px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      border-radius: 8px;
      z-index: 9999;
      pointer-events: auto;
    }
    
    .controls h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #ed225d;
    }
    
    .controls button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #ed225d;
      color: #fff;
      font-weight: bold;
    }
    
    .controls button:hover {
      background: #c71d4f;
    }
  </style>
</head>

<body>
  <div class="controls">
    <h2>AR Typography</h2>
    <button id="generateBtn">Generate</button>
  </div>

  <div id="p5container"></div>

  <script>
    // Typography sketch in p5.js instance mode
    let sketch = function(p) {
      let seed = 0;
      
      p.setup = function() {
        p.noCanvas();
        let cnv = p.createCanvas(512, 512);
        cnv.id("typoCanvas");
        cnv.hide();  // Use p5.js hide() method like in working example
        
        seed = p.random(9999);
      };
      
      p.draw = function() {
        p.randomSeed(seed);
        p.clear();
        p.background(0);
        
        // Draw "ateliernum" text with  random pattern
        p.textSize(64);
        p.textAlign(p.CENTER, p.CENTER);
        
        // Draw decorative pattern
        let step = 30;
        p.strokeWeight(3);
        p.noFill();
        
        for (let i = 0; i < p.width; i += step) {
          for (let j = 0; j < p.height; j += step) {
            p.stroke(p.random(200, 255), p.random(30, 100), p.random(100, 200), 150);
            if (p.random(1) > 0.5) {
              p.line(i, j, i + step, j + step);
            } else {
              p.line(i, j + step, i + step, j);
            }
          }
        }
        
        // Draw text on top
        p.fill(237, 34, 93);
        p.noStroke();
        p.text('ateliernum', p.width/2, p.height/2);
      };
      
      function regenerate() {
        seed = p.random(9999);
        console.log('Regenerated with seed:', seed);
      }
      
      // Expose regenerate function
      window.regenerateTypography = regenerate;
    };
    
    new p5(sketch, "p5container");
  </script>

  <script>
    AFRAME.registerComponent("typo-canvas", {
      init() {
        console.log('[typo-canvas] Initializing...');
        setTimeout(() => {
          const canvas = document.getElementById('typoCanvas');
          if (canvas) {
            console.log('[typo-canvas] Canvas found, setting as material source');
            this.el.setAttribute("material", {src: "#typoCanvas"});
          } else {
            console.error('[typo-canvas] Canvas not found');
          }
        }, 500);
      },
      tick() {
        const el = this.el;
        const material = el.getObject3D("mesh").material;
        if (!material.map) {
          return;
        }
        material.map.needsUpdate = true;
      }
    });
  </script>

  <a-scene embedded
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; changeMatrixMode: modelViewMatrix;"
    vr-mode-ui="enabled: false"
    renderer="sortObjects: true; antialias: true; colorManagement: true; physicallyCorrectLights; logarithmicDepthBuffer: true;"
    smooth="true" smoothCount="5" smoothTolerance=".05" smoothThreshold="5" sourceWidth="800" sourceHeight="600"
    displayWidth="1280" displayHeight="720">

    <a-marker type="barcode" value="0">
      <a-box width="1" height="1" position="0 0 0" material="shader: flat;" typo-canvas>
      </a-box>
    </a-marker>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    document.getElementById('generateBtn').addEventListener('click', function() {
      if (window.regenerateTypography) {
        window.regenerateTypography();
      }
    });
  </script>

</body>
</html>
