<!DOCTYPE html>
<html>
<!--
  p5.js Typography AR Demo with A-Frame
  ======================================
  
  This demo creates an augmented reality experience combining:
  - A-Frame: Web VR/AR framework
  - AR.js: Augmented reality for the web with marker tracking
  - p5.js: Creative coding library for graphics
  - Rune.js: Typography manipulation library
  
  How it works:
  1. Uses device camera to detect barcode marker value 0
  2. p5.js renders animated 3D typography to a canvas
  3. Canvas is used as texture on A-Frame plane
  4. Plane is anchored to the detected marker in AR space
  
  Requirements:
  - Device with camera
  - HTTPS or localhost for camera permissions
  - Barcode marker value 0 (generate at: https://ar-js-org.github.io/AR.js/three.js/examples/marker-training/examples/generator.html)
  
  Based on: https://github.com/b2renger/Introduction_A-frame#p5js-sketches
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Typography AR - A-Frame</title>
  
  <!-- A-Frame library -->
  <!-- Note: In production, use: <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script> -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- AR.js library -->
  <!-- Note: In production, use: <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script> -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <!-- p5.js library -->
  <script src="libraries/p5.js"></script>
  
  <!-- p5.scribble library for scribble effects -->
  <script src="libraries/p5.scribble.js"></script>
  
  <!-- Rune.js libraries for typography -->
  <script src="libraries/rune.js"></script>
  <script src="libraries/rune.font.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    html {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    a-scene {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
    }
    
    .a-canvas {
      width: 100% !important;
      height: 100% !important;
    }
    
    .controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 15px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      border-radius: 8px;
      z-index: 9999;
      max-width: 250px;
      pointer-events: auto;
    }
    
    .controls h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 16px;
      color: #ed225d;
    }
    
    .control-group {
      margin-bottom: 10px;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }
    
    .control-group select {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    
    .control-group button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #ed225d;
      color: #fff;
      font-weight: bold;
      transition: background 0.3s;
    }
    
    .control-group button:hover {
      background: #c71d4f;
    }
    
    @media (max-width: 768px) {
      .controls {
        top: 5px;
        left: 5px;
        right: 5px;
        padding: 10px;
        max-width: auto;
      }
      
      .controls h2 {
        font-size: 14px;
        margin-bottom: 8px;
      }
      
      .control-group button,
      .control-group select {
        padding: 6px;
        font-size: 12px;
      }
    }
    
    #p5Canvas {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <!-- Controls overlay -->
  <div class="controls">
    <h2>AR Typography</h2>
    <div class="control-group">
      <label for="cameraSelect">Camera:</label>
      <select id="cameraSelect">
        <option value="">Default Camera</option>
      </select>
    </div>
    <div class="control-group">
      <button id="generateBtn">Generate</button>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; videoTexture: true;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;">
    
    <!-- Define assets -->
    <a-assets>
      <a-asset-item id="p5-texture" src=""></a-asset-item>
    </a-assets>
    
    <!-- Camera with proper FOV to prevent zoom -->
    <a-entity camera look-controls="enabled: false" fov="80"></a-entity>
    
    <!-- Barcode Marker 0 -->
    <a-marker type="barcode" value="0">
      <!-- Test text to verify marker detection -->
      <a-text 
        value="MARKER DETECTED!" 
        position="0 1 0" 
        rotation="0 0 0"
        color="red" 
        align="center"
        width="3">
      </a-text>
      
      <!-- Container for p5.js rendered content -->
      <a-box 
        id="p5-box"
        position="0 0 0"
        rotation="0 0 0"
        width="1"
        height="1"
        depth="1"
        material="shader: flat;"
        p5-canvas
        visible="true">
      </a-box>
    </a-marker>
  </a-scene>

  <!-- Custom A-Frame component to link p5.js canvas to marker -->
  <script>
    AFRAME.registerComponent("p5-canvas", {
      init() {
        console.log('[p5-canvas] Component initializing...');
        const self = this;
        
        // Try multiple times to find the canvas
        let attempts = 0;
        const maxAttempts = 10;
        
        const trySetCanvas = () => {
          attempts++;
          const canvas = document.getElementById('p5Canvas');
          
          if (canvas) {
            console.log('[p5-canvas] Canvas found! Setting as material source');
            console.log('[p5-canvas] Canvas dimensions:', canvas.width, 'x', canvas.height);
            
            // Set the material source
            self.el.setAttribute("material", {
              src: "#p5Canvas",
              shader: "flat",
              transparent: false,
              side: "double"
            });
            
            console.log('[p5-canvas] Material set successfully');
          } else {
            console.warn('[p5-canvas] Canvas not found, attempt', attempts, 'of', maxAttempts);
            
            if (attempts < maxAttempts) {
              setTimeout(trySetCanvas, 500);
            } else {
              console.error('[p5-canvas] Failed to find canvas after', maxAttempts, 'attempts');
            }
          }
        };
        
        // Start trying after a short delay
        setTimeout(trySetCanvas, 1000);
      },
      
      tick() {
        const el = this.el;
        const mesh = el.getObject3D("mesh");
        
        if (!mesh || !mesh.material) {
          return;
        }
        
        const material = mesh.material;
        
        if (material.map) {
          material.map.needsUpdate = true;
        }
      }
    });
  </script>

  <!-- p5.js sketch -->
  <script>
    // Available fonts
    const fonts = [
      "fonts/AvenirNextLTW01-Medium.woff",
      "fonts/Black_Ops_One/BlackOpsOne-Regular.ttf",
      "fonts/Comfortaa/Comfortaa-Bold.ttf",
      "fonts/Nova_Mono/NovaMono.ttf",
      "fonts/Shadows_Into_Light/ShadowsIntoLight.ttf",
      "fonts/Sniglet/Sniglet-ExtraBold.ttf",
      "fonts/Tangerine/Tangerine_Bold.ttf",
      "fonts/Unica_One/UnicaOne-Regular.ttf"
    ];

    // Global variables
    let f;
    let path;
    let polys;
    let drawing = false;
    let currentExample = 'tentacles';
    let currentFont;
    let currentColor;
    let params = {};
    let p5Font;
    let p5Canvas;
    
    // Tentacles specific
    let tentacles = [];
    let anchorX, anchorY;
    
    // Scribble specific
    let scribble;
    let seed;
    
    // 3D specific
    let shapes = [];
    
    // Random color generator
    function randomColor() {
      return [random(150, 255), random(150, 255), random(150, 255)];
    }
    
    function randomBrightColor() {
      const hue = random(360);
      colorMode(HSB, 360, 100, 100);
      const c = color(hue, random(70, 100), random(80, 100));
      colorMode(RGB, 255);
      return [red(c), green(c), blue(c)];
    }
    
    function ensureContrast(bgColor, fgColor) {
      const getLuminance = (rgb) => {
        const [r, g, b] = rgb;
        return 0.299 * r + 0.587 * g + 0.114 * b;
      };
      
      const bgLum = getLuminance(bgColor);
      const fgLum = getLuminance(fgColor);
      
      if (Math.abs(bgLum - fgLum) < 100) {
        if (bgLum < 128) {
          return [random(200, 255), random(200, 255), random(200, 255)];
        } else {
          return [random(50, 100), random(50, 100), random(50, 100)];
        }
      }
      return fgColor;
    }
    
    function randomFont() {
      return fonts[Math.floor(Math.random() * fonts.length)];
    }
    
    function randomPreset(presets) {
      return presets[Math.floor(Math.random() * presets.length)];
    }
    
    function getTentaclesPreset() {
      const bg = [0, 0, 0];
      const fg = ensureContrast(bg, randomBrightColor());
      const presets = [
        {
          background: bg,
          color: fg,
          spacing: 2,
          tnoiseMultiplicator: 5,
          tminRandom: 5,
          tmaxRandom: 10,
          tdimStep: 0.07
        },
        {
          background: [0, 0, 0, 15],
          color: ensureContrast([0, 0, 0], randomBrightColor()).concat([15]),
          spacing: 5,
          tnoiseMultiplicator: 10,
          tminRandom: 5,
          tmaxRandom: 10,
          tdimStep: 0.07
        },
        {
          background: [0, 0, 0, 0],
          color: ensureContrast([0, 0, 0], randomBrightColor()).concat([20]),
          spacing: 8,
          tnoiseMultiplicator: 5,
          tminRandom: 5,
          tmaxRandom: 10,
          tdimStep: 0.07
        },
        {
          background: [0, 0, 0, 0],
          color: ensureContrast([0, 0, 0], randomBrightColor()).concat([30]),
          spacing: 20,
          tnoiseMultiplicator: 45,
          tminRandom: 5,
          tmaxRandom: 10,
          tdimStep: 0.07
        }
      ];
      return randomPreset(presets);
    }
    
    function getScribblePreset() {
      const bg = [0, 0, 0];
      const fg = ensureContrast(bg, randomBrightColor());
      const presets = [
        {
          spacing: 50,
          bowing: 1,
          roughness: 5,
          maxOffset: 1.2,
          stroke_weight: 1,
          shape_size: 0,
          shape: 0,
          color: fg.concat([150])
        },
        {
          spacing: 10,
          bowing: 313,
          roughness: 1,
          maxOffset: 3.2,
          stroke_weight: 3,
          shape_size: 50,
          shape: 0,
          color: ensureContrast(bg, randomBrightColor()).concat([150])
        },
        {
          spacing: 10,
          bowing: 1,
          roughness: 26,
          maxOffset: 1,
          stroke_weight: 0.5,
          shape_size: 50,
          shape: 0,
          color: ensureContrast(bg, randomBrightColor()).concat([150])
        },
        {
          spacing: 5,
          bowing: 1,
          roughness: 1,
          maxOffset: 1,
          stroke_weight: 10,
          shape_size: 100,
          shape: 2,
          color: ensureContrast(bg, randomBrightColor()).concat([2])
        }
      ];
      return randomPreset(presets);
    }
    
    function getLightRaysPreset() {
      const bg = [random(0, 50), random(0, 50), random(0, 50)];
      return {
        spacing: random(5, 20),
        background: bg,
        color: ensureContrast(bg, randomBrightColor()),
        stroke_weight: random(0.1, 5)
      };
    }
    
    function getSpotLightsPreset() {
      const bg = [random(200, 255), random(200, 255), random(200, 255)];
      return {
        spacing: random(5, 20),
        background: bg,
        color: ensureContrast(bg, randomBrightColor()),
        stroke_weight: random(0.1, 5)
      };
    }
    
    function get3DPreset() {
      const bg = [random(0, 50), random(0, 50), random(0, 50)];
      return {
        spacing: random(10, 30),
        background: bg,
        shape_size: random(15, 35),
        shape_type: floor(random(0, 7)),
        alignement_x: 0,
        alignement_y: 0,
        animation: 0,
        animation_speed: 0.025
      };
    }
    
    // Generate typography with random example
    function generateTypography() {
      drawing = false;
      
      // Randomly select example
      const examples = ['tentacles', 'scribble', 'light_rays', 'spot_lights', '3d'];
      currentExample = examples[Math.floor(Math.random() * examples.length)];
      
      currentFont = randomFont();
      
      // Get preset based on current example
      switch(currentExample) {
        case 'tentacles':
          params = getTentaclesPreset();
          break;
        case 'scribble':
          params = getScribblePreset();
          seed = random(1000);
          break;
        case 'light_rays':
          params = getLightRaysPreset();
          break;
        case 'spot_lights':
          params = getSpotLightsPreset();
          break;
        case '3d':
          params = get3DPreset();
          break;
      }
      
      params.message = 'ateliernum';
      params.size = 200; // Fixed size for AR
      params.font = currentFont;
      
      // Load font for bounds calculation
      loadFont(currentFont, function(font) {
        p5Font = font;
        
        if (currentExample !== '3d') {
          textFont(p5Font);
          textSize(params.size);
        }
        const bounds = p5Font.textBounds(params.message, 0, 0, params.size);
        
        params.xoffset = -bounds.x - bounds.w / 2;
        params.yoffset = -bounds.y - bounds.h / 2;
        
        // Load Rune font for polygons
        f = new Rune.Font(currentFont);
        f.load(function(err) {
          if (err) {
            console.error('Error loading font:', err);
            return;
          }
          
          path = f.toPath(params.message, 0, 0, params.size);
          polys = path.toPolygons({ spacing: params.spacing });
          
          // Initialize example-specific data
          switch(currentExample) {
            case 'tentacles':
              background(params.background || [0, 0, 0]);
              initTentacles();
              break;
            case 'scribble':
              break;
            case 'light_rays':
              break;
            case 'spot_lights':
              break;
            case '3d':
              init3D();
              break;
          }
          
          drawing = true;
          console.log('Typography loaded:', currentExample);
        });
      });
    }
    
    // Initialize tentacles
    function initTentacles() {
      tentacles = [];
      for (let i = 0; i < polys.length; i++) {
        let poly = polys[i];
        for (let j = 0; j < poly.state.vectors.length; j++) {
          let vec = poly.state.vectors[j];
          tentacles.push(new Tentacle(
            vec.x, vec.y,
            params.tnoiseMultiplicator,
            params.tminRandom,
            params.tmaxRandom,
            params.tdimStep
          ));
        }
      }
    }
    
    // Tentacle class
    function Tentacle(x, y, noiseM, minRand, maxRand, dimStep) {
      this.x = x;
      this.y = y;
      this.minRandom = minRand;
      this.maxRandom = maxRand;
      this.dimStep = dimStep;
      this.size = random(this.minRandom, this.maxRandom);
      this.angle = random(360);
      this.radius = 0;
      this.noiseFactor = random(500);
      this.noiseMultiplicator = noiseM;
      
      this.draw = function() {
        this.radius += 1;
        this.angle = this.angle + noise(this.noiseFactor, 10) * this.noiseMultiplicator - this.noiseMultiplicator / 2;
        this.size -= this.dimStep;
        this.noiseFactor += 0.005;
        
        fill(params.color);
        noStroke();
        let drawX = this.x + this.radius * cos(radians(this.angle));
        let drawY = this.y + this.radius * sin(radians(this.angle));
        ellipse(drawX, drawY, this.size, this.size);
        
        if (this.size < 0) {
          this.angle = random(360);
          this.radius = 0;
          this.noiseFactor = random(500);
          this.size = random(this.minRandom, this.maxRandom);
        }
      };
    }
    
    // Initialize 3D shapes
    function init3D() {
      shapes = [];
      for (let i = 0; i < polys.length; i++) {
        let poly = polys[i];
        for (let j = 0; j < poly.state.vectors.length; j++) {
          let vec = poly.state.vectors[j];
          shapes.push(new Shape3D(vec.x, vec.y, 0));
        }
      }
    }
    
    // Shape3D class
    function Shape3D(x, y, z) {
      this.x = x;
      this.y = y;
      this.z = z;
      this.anchorx = x;
      this.anchory = y;
      this.anchorz = z;
      this.oriX = 0;
      this.oriY = 0;
      
      this.update = function() {
        if (params.animation === 0) {
          this.x = lerp(this.x, this.anchorx, params.animation_speed);
          this.y = lerp(this.y, this.anchory, params.animation_speed);
          this.z = lerp(this.z, this.anchorz, params.animation_speed);
        } else {
          this.x = lerp(this.x, random(-200, 200), params.animation_speed);
          this.y = lerp(this.y, random(-200, 200), params.animation_speed);
          this.z = lerp(this.z, random(-200, 200), params.animation_speed);
        }
      };
      
      this.display = function() {
        push();
        translate(this.x, this.y, this.z);
        rotateY(map(this.oriX, 0, 512, -PI, PI));
        rotateX(map(this.oriY, 0, 512, -PI, PI));
        this.drawShape();
        pop();
      };
      
      this.drag = function(x, y) {
        this.oriX = x;
        this.oriY = y;
      };
      
      this.drawShape = function() {
        switch(params.shape_type) {
          case 0: cone(params.shape_size, params.shape_size); break;
          case 1: ellipsoid(params.shape_size, params.shape_size, params.shape_size); break;
          case 2: torus(params.shape_size, params.shape_size / 3); break;
          case 3: cylinder(params.shape_size, params.shape_size); break;
          case 4: sphere(params.shape_size); break;
          case 5: box(params.shape_size); break;
          case 6: plane(params.shape_size, params.shape_size); break;
        }
      };
    }
    
    function setup() {
      // Create canvas for AR texture
      if (currentExample === '3d') {
        p5Canvas = createCanvas(512, 512, WEBGL);
      } else {
        p5Canvas = createCanvas(512, 512);
      }
      p5Canvas.id('p5Canvas');
      
      scribble = new Scribble();
      anchorX = 256;
      anchorY = 256;
      
      background(0);
      
      // Auto-generate initial content so marker has something to show
      setTimeout(() => {
        generateTypography();
      }, 1500);
    }
    
    function draw() {
      // Always update background even if not drawing yet
      background(params.background || [0, 0, 0]);
      
      if (!drawing) {
        // A-Frame component handles texture updates
        return;
      }
      
      switch(currentExample) {
        case 'tentacles':
          drawTentacles();
          break;
        case 'scribble':
          drawScribble();
          break;
        case 'light_rays':
          drawLightRays();
          break;
        case 'spot_lights':
          drawSpotLights();
          break;
        case '3d':
          draw3D();
          break;
      }
      
      // A-Frame component handles texture updates via tick()
    }
    
    function drawTentacles() {
      push();
      translate(params.xoffset + 256, params.yoffset + 256);
      for (let i = 0; i < tentacles.length; i++) {
        tentacles[i].draw();
      }
      pop();
    }
    
    function drawScribble() {
      scribble.bowing = params.bowing;
      scribble.roughness = params.roughness;
      scribble.maxOffset = params.maxOffset;
      randomSeed(seed);
      
      push();
      translate(params.xoffset + 256, params.yoffset + 256);
      strokeWeight(params.stroke_weight);
      stroke(params.color);
      
      for (let i = 0; i < polys.length; i++) {
        let poly = polys[i];
        for (let j = 1; j < poly.state.vectors.length; j++) {
          let vec1 = poly.state.vectors[j];
          let vec2 = poly.state.vectors[j - 1];
          noFill();
          stroke(params.color);
          strokeWeight(params.stroke_weight);
          
          if (params.shape === 0) {
            scribble.scribbleLine(vec1.x, vec1.y, vec2.x, vec2.y);
          } else if (params.shape === 1) {
            scribble.scribbleEllipse(vec1.x, vec1.y, params.shape_size, params.shape_size);
          } else if (params.shape === 2) {
            scribble.scribbleRect(vec1.x, vec1.y, params.shape_size, params.shape_size);
          }
        }
      }
      pop();
    }
    
    function drawLightRays() {
      push();
      translate(params.xoffset + 256, params.yoffset + 256);
      strokeWeight(params.stroke_weight);
      stroke(params.color);
      
      for (let i = 0; i < polys.length; i++) {
        let poly = polys[i];
        for (let j = 0; j < poly.state.vectors.length; j++) {
          let vec = poly.state.vectors[j];
          line(anchorX - params.xoffset - 256, anchorY - params.yoffset - 256, vec.x, vec.y);
        }
      }
      pop();
    }
    
    function drawSpotLights() {
      push();
      translate(params.xoffset + 256, params.yoffset + 256);
      strokeWeight(params.stroke_weight);
      stroke(params.color);
      
      for (let i = 0; i < polys.length; i++) {
        let poly = polys[i];
        for (let j = 0; j < poly.state.vectors.length; j++) {
          let vec = poly.state.vectors[j];
          let angle = atan2(vec.y - (anchorY - params.yoffset - 256), vec.x - (anchorX - params.xoffset - 256));
          let len = random(50, 150);
          let endX = vec.x + cos(angle) * len;
          let endY = vec.y + sin(angle) * len;
          line(vec.x, vec.y, endX, endY);
        }
      }
      pop();
    }
    
    function draw3D() {
      ambientLight(50);
      directionalLight(255, 255, 255, 0.55, 0.25, 0.25);
      directionalLight(255, 255, 255, -0.55, -0.25, -0.25);
      directionalLight(255, 255, 255, 0, 0.5, -0.3);
      pointLight(255, 255, 255, 0, 0, 200);
      
      push();
      translate(params.alignement_x, params.alignement_y, 0);
      
      for (let i = 0; i < shapes.length; i++) {
        shapes[i].update();
        shapes[i].drag(256, 256);
        const brightCol = randomBrightColor();
        fill(brightCol[0], brightCol[1], brightCol[2]);
        shapes[i].display();
      }
      pop();
    }
    
    function mouseDragged() {
      if (currentExample === 'light_rays' || currentExample === 'spot_lights') {
        anchorX = mouseX;
        anchorY = mouseY;
      }
    }
    
    // Event listeners
    
    // Camera enumeration and selection
    let availableCameras = [];
    let currentCameraId = null;
    
    // Enumerate available cameras
    async function enumerateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        availableCameras = devices.filter(device => device.kind === 'videoinput');
        
        const cameraSelect = document.getElementById('cameraSelect');
        cameraSelect.innerHTML = '<option value="">Default Camera</option>';
        
        availableCameras.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });
        
        console.log(`Found ${availableCameras.length} cameras`);
      } catch (error) {
        console.error('Error enumerating cameras:', error);
      }
    }
    
    // Switch camera
    async function switchCamera(deviceId) {
      console.log('Switching to camera:', deviceId || 'default');
      
      const scene = document.querySelector('a-scene');
      if (!scene) {
        console.error('Scene not found');
        return;
      }
      
      currentCameraId = deviceId;
      
      // Wait for AR.js to be ready
      if (!scene.systems || !scene.systems.arjs) {
        console.error('AR.js system not ready');
        return;
      }
      
      const arjsSystem = scene.systems.arjs;
      
      // Get the video element
      let videoElement = arjsSystem.videoElement;
      
      if (!videoElement) {
        // Try to find it in different ways
        videoElement = document.querySelector('video');
        if (!videoElement) {
          console.error('Video element not found');
          return;
        }
      }
      
      try {
        // Stop current stream
        const currentStream = videoElement.srcObject;
        if (currentStream) {
          currentStream.getTracks().forEach(track => {
            track.stop();
            console.log('Stopped track:', track.label);
          });
        }
        
        // Prepare constraints for new stream
        const constraints = {
          audio: false,
          video: {
            width: { ideal: 1280 },
            height: { ideal: 960 }
          }
        };
        
        // Set device ID or facing mode
        if (deviceId) {
          constraints.video.deviceId = { exact: deviceId };
        } else {
          constraints.video.facingMode = 'environment';
        }
        
        console.log('Requesting camera with constraints:', constraints);
        
        // Get new stream
        const newStream = await navigator.mediaDevices.getUserMedia(constraints);
        console.log('Got new stream:', newStream.id);
        
        // Apply new stream to video element
        videoElement.srcObject = newStream;
        
        // Play the video
        try {
          await videoElement.play();
          console.log('Camera switched and playing successfully');
        } catch (playError) {
          console.error('Error playing video:', playError);
        }
        
      } catch (error) {
        console.error('Error switching camera:', error);
        alert(`Failed to switch camera: ${error.message}`);
      }
    }
    
    // Camera select event listener
    document.getElementById('cameraSelect').addEventListener('change', function(e) {
      const deviceId = e.target.value;
      switchCamera(deviceId);
    });
    
    // Initialize camera enumeration after scene is loaded
    window.addEventListener('load', function() {
      // Add marker detection listeners for debugging
      const marker = document.querySelector('a-marker');
      if (marker) {
        marker.addEventListener('markerFound', function() {
          console.log('Marker detected!');
        });
        marker.addEventListener('markerLost', function() {
          console.log('Marker lost!');
        });
      }
      
      // Wait for AR.js to initialize
      setTimeout(async () => {
        // Request camera permission first
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach(track => track.stop());
          await enumerateCameras();
        } catch (error) {
          console.error('Camera permission error:', error);
        }
      }, 1000);
    });
    
    document.getElementById('generateBtn').addEventListener('click', function() {
      // Recreate canvas with correct renderer based on random example
      const examples = ['tentacles', 'scribble', 'light_rays', 'spot_lights', '3d'];
      const nextExample = examples[Math.floor(Math.random() * examples.length)];
      
      if (nextExample === '3d' && currentExample !== '3d') {
        const canvas = document.querySelector('canvas');
        if (canvas) canvas.remove();
        p5Canvas = createCanvas(512, 512, WEBGL);
        p5Canvas.id('p5Canvas');
      } else if (nextExample !== '3d' && currentExample === '3d') {
        const canvas = document.querySelector('canvas');
        if (canvas) canvas.remove();
        p5Canvas = createCanvas(512, 512);
        p5Canvas.id('p5Canvas');
      }
      
      generateTypography();
    });
  </script>
