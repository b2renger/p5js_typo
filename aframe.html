<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Typography AR - A-Frame</title>
  
  <!-- A-Frame library -->
  <!-- Note: In production, use: <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script> -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- AR.js library -->
  <!-- Note: In production, use: <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script> -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <!-- p5.js library -->
  <script src="libraries/p5.js"></script>
  
  <!-- Rune.js libraries for typography -->
  <script src="libraries/rune.js"></script>
  <script src="libraries/rune.font.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    
    .info {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      border-radius: 5px;
      z-index: 1000;
      max-width: 250px;
    }
    
    #p5Canvas {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Info overlay -->
  <div class="info">
    <strong>p5.js Typography AR</strong><br>
    Point camera at barcode marker 0
  </div>

  <!-- A-Frame Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;">
    
    <!-- Define assets -->
    <a-assets>
      <a-asset-item id="p5-texture" src=""></a-asset-item>
    </a-assets>
    
    <!-- Camera -->
    <a-entity camera></a-entity>
    
    <!-- Barcode Marker 0 -->
    <a-marker type="barcode" value="0">
      <!-- Container for p5.js rendered content -->
      <a-plane 
        id="p5-plane"
        position="0 0 0"
        rotation="-90 0 0"
        width="2"
        height="2"
        material="transparent: true; opacity: 1; side: double;">
      </a-plane>
    </a-marker>
  </a-scene>

  <!-- p5.js sketch -->
  <script>
    // p5.js variables
    let f;
    let path;
    let polys;
    let drawing = false;
    let shapes = [];
    let params;
    let animationOffset = 0;
    let p5Canvas;
    
    // Typography configuration
    const config = {
      font: "fonts/AvenirNextLTW01-Medium.woff",
      message: 'AR',
      spacing: 15,
      size: 200,
      shape_size: 12,
      shape_type: 4, // sphere
      animation_speed: 0.02
    };
    
    // Load font and generate typography points
    function getPoints() {
      drawing = false;
      f = new Rune.Font(config.font);
      
      f.load(function(err) {
        if (err) {
          console.error("Font loading error:", err);
          return;
        }
        
        path = f.toPath(config.message, 0, 0, config.size);
        polys = path.toPolygons({ spacing: config.spacing });
        
        shapes = [];
        
        for (let i = 0; i < polys.length; i++) {
          const poly = polys[i];
          for (let j = 0; j < poly.state.vectors.length; j++) {
            const vec = poly.state.vectors[j];
            shapes.push({
              x: vec.x,
              y: vec.y,
              z: 0,
              index: i * poly.state.vectors.length + j
            });
          }
        }
        
        drawing = true;
        console.log("Typography loaded with " + shapes.length + " shapes");
      });
    }
    
    function setup() {
      // Create p5 canvas
      p5Canvas = createCanvas(512, 512, WEBGL);
      p5Canvas.id('p5Canvas');
      
      // Load typography
      getPoints();
    }
    
    function draw() {
      // Clear with transparent background
      background(0, 0, 0, 0);
      
      if (!drawing || shapes.length === 0) {
        return;
      }
      
      // Setup lighting
      ambientLight(50);
      directionalLight(200, 0, 100, 0.5, 0.5, 0.5);
      pointLight(200, 100, 150, 0, 0, 100);
      
      // Center and scale the typography
      push();
      translate(-config.size / 2, -config.size / 2, 0);
      
      // Render all shapes
      for (let i = 0; i < shapes.length; i++) {
        const shape = shapes[i];
        
        push();
        translate(shape.x, shape.y, shape.z);
        
        // Animated rotation
        const phaseOffset = shape.index * 0.1;
        rotateY(animationOffset + phaseOffset);
        rotateX(animationOffset * 0.5 + phaseOffset);
        
        // Set color with gradient based on position
        const hue = (shape.index / shapes.length) * 360;
        const col = color('hsl(' + hue + ', 80%, 60%)');
        fill(col);
        noStroke();
        
        // Draw shape (sphere)
        sphere(config.shape_size);
        
        pop();
      }
      
      pop();
      
      // Update animation
      animationOffset += config.animation_speed;
      
      // Update the A-Frame plane texture
      updateTexture();
    }
    
    // Update A-Frame plane with p5 canvas
    function updateTexture() {
      const plane = document.querySelector('#p5-plane');
      if (plane && p5Canvas) {
        const canvasEl = p5Canvas.elt;
        
        if (!plane.material) {
          return;
        }
        
        // Update material with canvas texture
        if (!plane.material.map || plane.material.map.image !== canvasEl) {
          const texture = new THREE.CanvasTexture(canvasEl);
          texture.needsUpdate = true;
          plane.setAttribute('material', {
            src: canvasEl,
            transparent: true,
            opacity: 1,
            side: THREE.DoubleSide
          });
        } else {
          plane.material.map.needsUpdate = true;
        }
      }
    }
    
    // Handle window resize
    function windowResized() {
      // Keep canvas size constant for AR
    }
  </script>
</body>
</html>
